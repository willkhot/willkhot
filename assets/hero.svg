<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Will Khotsyphom — always learning and building</title>
<desc id="desc">Moving circuit signals and a typing terminal. Cloud, identity, and automation.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f35"/><stop offset="1" stop-color="#080f1d"/></linearGradient>
    <linearGradient id="gold"><stop stop-color="#FFE681"/><stop offset="1" stop-color="#FFBA26"/></linearGradient>
  <linearGradient id="circuit"><stop stop-color="#58CFFF" stop-opacity="0"/><stop offset=".5" stop-color="#58CFFF"/><stop offset="1" stop-color="#FFD43B"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#91b9e6" stroke-opacity=".055"/></pattern>
    <clipPath id="typing"><rect class="type-reveal" x="85" y="244" width="560" height="48"/></clipPath>
</defs>
<style>
  text{font-family:Arial,Helvetica,sans-serif}
  .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
      .signal{stroke-dasharray:16 430;animation:signal 5s linear infinite}
  .spark{animation:spark 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .type-reveal{animation:typing 10s steps(38,end) infinite}
  .cursor{animation:cursor 10s steps(38,end) infinite,blink 1s step-end infinite}
  .status{animation:status 5s ease-in-out infinite}
  @keyframes signal{to{stroke-dashoffset:-892}}
  @keyframes spark{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:.9;transform:translateY(-7px)}}
  @keyframes typing{0%,8%{width:0}38%,88%{width:552px}98%,100%{width:0}}
  @keyframes cursor{0%,8%{transform:translateX(0)}38%,88%{transform:translateX(552px)}98%,100%{transform:translateX(0)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes status{0%,100%{opacity:.45}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.type-reveal{width:560px}.cursor{display:none}}
</style>
<rect x="1" y="1" width="998" height="388" rx="25" fill="#101D30" stroke="#263951" stroke-width="2"/>
<rect x="2" y="2" width="996" height="386" rx="24" fill="url(#grid)"/>
<g fill="none" stroke="#29465c" stroke-width="2">
 <path d="M-10 341H317L355 303H633L671 341H1007"/>
 <path d="M635 0V57L674 96H944L974 126H1000"/>
 <path d="M660 390V328L704 284H939L999 224"/>
</g>
<g fill="none" stroke="url(#circuit)" stroke-width="3">
 <path class="signal" d="M-10 341H317L355 303H633L671 341H1007"/>
 <path class="signal" style="animation-delay:-2s" d="M635 0V57L674 96H944L974 126H1000"/>
 <path class="signal" style="animation-delay:-4s" d="M660 390V328L704 284H939L999 224"/>
</g>
<g class="mono" font-size="19" fill="#8097b3">
 <text x="48" y="45">~/willkhot</text>
 <text x="948" y="45" text-anchor="end">&lt;/&gt;</text>
</g>
<text x="47" y="100" font-size="27" fill="#FFD43B">Hi, I'm</text>
<text x="44" y="160" font-size="58" font-weight="700" letter-spacing="-2" fill="#F4F8FF">Will Khotsyphom</text>
<text x="48" y="206" font-size="27" fill="#B9C8DC">Cloud · Identity · Automation</text>
<rect x="46" y="232" width="620" height="73" rx="13" fill="#070E19" stroke="#29435e"/>
<text x="61" y="277" class="mono" font-size="26" fill="#FFD43B">&gt;</text>
<g clip-path="url(#typing)"><text x="87" y="277" class="mono" font-size="24" fill="#E6EDF5">Securing the cloud, one lab at a time.</text></g>
<rect class="cursor" x="87" y="256" width="12" height="27" fill="#FFD43B"/>
<g fill="#FFD43B">
 <rect class="spark" x="643" y="169" width="8" height="8"/>
 <rect class="spark" style="animation-delay:-1s" x="939" y="93" width="11" height="11"/>
 <rect class="spark" style="animation-delay:-2s" x="926" y="281" width="7" height="7"/>
</g>
<g fill="#58CFFF">
 <rect class="spark" style="animation-delay:-2.5s" x="682" y="37" width="7" height="7"/>
 <rect class="spark" style="animation-delay:-.5s" x="950" y="209" width="7" height="7"/>
</g>
<circle class="status" cx="54" cy="358" r="5" fill="#6AE3AC"/>
<text x="70" y="365" class="mono" font-size="18" fill="#B9C8DC">UMSL / CYBERSECURITY</text>
<text x="945" y="365" class="mono" font-size="18" text-anchor="end" fill="#B9C8DC">ST. LOUIS, MO</text>
