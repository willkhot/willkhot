<svg xmlns="http://www.w3.org/2000/svg" width="94" height="46" viewBox="0 0 94 46" role="img" aria-label="IAM">
<style>.beam{animation:beam 7s linear infinite;animation-delay:-1.21s}.dot{animation:dot 4s ease-in-out infinite;animation-delay:-1.21s}@keyframes beam{0%{transform:translateX(-80px)}100%{transform:translateX(280px)}}@keyframes dot{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.beam{display:none}}</style>
<defs><clipPath id="c"><rect x=".5" y=".5" width="93" height="45" rx="9"/></clipPath><linearGradient id="g"><stop stop-color="#FFD43B" stop-opacity="0"/><stop offset=".5" stop-color="#FFD43B"/><stop offset="1" stop-color="#FFD43B" stop-opacity="0"/></linearGradient></defs>
<rect x=".5" y=".5" width="93" height="45" rx="9" fill="#101D30" stroke="#30465e"/>
<circle class="dot" cx="17" cy="23" r="4" fill="#F78166"/>
<text x="30" y="30" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#E6EDF5">IAM</text>
